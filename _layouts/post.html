<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} — {{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header><a class="brand" href="{{ '/' | relative_url }}">FirstCommit<span>.</span></a><a href="{{ '/' | relative_url }}">Back</a></header>
<main class="post">
<div class="date">{{ page.date | date: "%B %-d, %Y" }}</div>
<h1>{{ page.title }}</h1>
{{ content }}
</main>
<footer>© {{ site.time | date: "%Y" }} FirstCommit</footer>
</body>
</html>
