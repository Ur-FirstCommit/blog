<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} — FirstCommit</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="nav"><a class="logo" href="{{ '/' | relative_url }}"><span>first</span>commit<span class="dot">.</span></a><nav><a href="{{ '/' | relative_url }}">← Blog</a><a class="nav-pill" href="https://firstcommit.xyz">firstcommit.xyz ↗</a></nav></header>
<main class="article-wrap">
<div class="article-meta"><span class="tag">{{ page.categories | first | default: "BUILDING" }}</span><span>{{ page.date | date: "%B %-d, %Y" }}</span></div>
<h1>{{ page.title }}</h1>
<div class="article-content">{{ content }}</div>
</main>
<footer><a class="logo" href="{{ '/' | relative_url }}"><span>first</span>commit<span class="dot">.</span></a><span>© {{ site.time | date: "%Y" }} FirstCommit</span></footer>
</body></html>
