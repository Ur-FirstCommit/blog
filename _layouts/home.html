<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header><a class="brand" href="{{ '/' | relative_url }}">FirstCommit<span>.</span></a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></header>
<main class="hero">
<p class="eyebrow">FIRSTCOMMIT / BLOG</p>
<h1>Build. Learn. <em>Ship.</em></h1>
<p class="intro">{{ site.description }}</p>
</main>
<section class="posts">
{% for post in site.posts %}
<article>
<div class="date">{{ post.date | date: "%B %-d, %Y" }}</div>
<h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
<p>{{ post.excerpt | strip_html | truncate: 180 }}</p>
<a class="read" href="{{ post.url | relative_url }}">Read post →</a>
</article>
{% endfor %}
</section>
<footer>© {{ site.time | date: "%Y" }} FirstCommit</footer>
</body>
</html>
