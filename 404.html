<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="FirstCommit — Page not found">
<title>404 — FirstCommit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grain"></div>
<div class="ambient" aria-hidden="true">
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>
  <div class="ambient-blob blob-3"></div>
</div>

<header class="nav">
  <a class="logo" href="index.html"><span>first</span>commit<span class="dot">.</span></a>
  <nav>
    <a href="index.html#latest">Latest</a>
    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☼</button>
    <a class="nav-back" href="index.html" aria-label="Back to blog">← Blog</a>
  </nav>
</header>

<main class="error-page">
  <div class="error-content">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Page not found</h2>
    <p class="error-desc">The page you're looking for doesn't exist or may have been moved.</p>
    <a href="index.html" class="primary-btn error-btn">Back to Home <b>→</b></a>
  </div>
</main>

<footer>
  <a class="logo" href="index.html"><span>first</span>commit<span class="dot">.</span></a>
  <span>Make your first commit.</span>
  <span>© <span id="year"></span> Harshil Arora</span>
</footer>

<div class="floating-search" id="floatingSearch">
  <div class="floating-search-results" id="floatingResults"></div>
  <div class="floating-search-pill" id="floatingPill">
    <svg class="floating-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="floating-search-label">Search</span>
    <input type="text" class="floating-search-input" id="floatingInput" placeholder="Search" autocomplete="off" aria-label="Search blog posts">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
function parseFrontMatter(md){const m=md.match(/^---\s*([\s\S]*?)\s*---\s*/);const data={};let body=md;if(m){m[1].split(/\r?\n/).forEach(line=>{const i=line.indexOf(":");if(i<0)return;let k=line.slice(0,i).trim(),v=line.slice(i+1).trim();if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))v=v.slice(1,-1);data[k]=v});body=md.slice(m[0].length)}return{meta:data,body}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
const saved=localStorage.getItem("fc-theme");if(saved==="light")document.body.classList.add("light");
document.querySelector("#themeToggle").onclick=()=>{document.body.classList.toggle("light");localStorage.setItem("fc-theme",document.body.classList.contains("light")?"light":"dark")};
document.querySelector("#year").textContent=new Date().getFullYear();

const fsPill=document.querySelector("#floatingPill");
const fsInput=document.querySelector("#floatingInput");
const fsResults=document.querySelector("#floatingResults");
let fsPosts=[],fsActive=false;
fetch("posts/index.json").then(r=>r.json()).then(names=>Promise.all(names.map(n=>fetch("posts/"+n).then(r=>r.text()).then(raw=>{const{meta,body}=parseFrontMatter(raw);return{...meta,body,file:n}})))).then(posts=>{fsPosts=posts});
function fsExpand(){if(fsActive)return;fsPill.classList.add("expanded");fsActive=true;requestAnimationFrame(()=>setTimeout(()=>fsInput.focus(),120))}
function fsCollapse(){if(fsInput.value)return;fsResults.classList.remove("visible");fsInput.value="";setTimeout(()=>{fsPill.classList.remove("expanded");fsResults.innerHTML="";fsActive=false},40)}
fsPill.addEventListener("click",()=>{if(!fsActive)fsExpand()});
fsInput.addEventListener("blur",()=>setTimeout(fsCollapse,180));
fsInput.addEventListener("input",()=>{const q=fsInput.value.toLowerCase().trim();if(!q){fsResults.classList.remove("visible");fsResults.innerHTML="";return}const hits=fsPosts.filter(p=>(p.title+" "+p.description+" "+p.category).toLowerCase().includes(q)).slice(0,5);fsResults.innerHTML=hits.length?hits.map(p=>`<a class="fs-result" href="post.html?post=${encodeURIComponent(p.file)}"><small>${esc(p.category||"BUILDING")}</small><b>${esc(p.title)}</b></a>`).join(""):'<div class="fs-empty">No matching stories.</div>';fsResults.classList.add("visible")});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="/"){e.preventDefault();fsExpand()}if(e.key==="Escape"&&fsActive){fsInput.blur();fsCollapse()}});
</script>
</body>
</html>
